# TLS is expected to terminate in front of this (load balancer, Cloudflare or
# certbot); the app sets HSTS and secure cookies when DEBUG is off.
server {
    listen 80;
    server_name _;
    client_max_body_size 5m;

    # Security headers for the web app
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://checkout.paystack.com https://checkout.flutterwave.com" always;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 60s;
    }

    # Django admin (use DJANGO_ADMIN_URL to move it off the default path)
    location /admin/ { proxy_pass http://api:8000; proxy_set_header Host $host;
                       proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                       proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; }
    location /static/ { alias /srv/static/; expires 30d; }

    # The single-page web app; hashed assets cache forever, index.html never
    location /assets/ { root /srv/app; expires 1y; add_header Cache-Control "public, immutable"; }
    location / {
        root /srv/app;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
