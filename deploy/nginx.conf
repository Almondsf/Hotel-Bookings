# TLS is expected to terminate in front of this (load balancer, Cloudflare or
# certbot); the app sets HSTS and secure cookies when DEBUG is off.

# Behind a load balancer or Cloudflare, every request arrives from the proxy's address, so
# rate limits would lump all guests together. Trust the proxy's header for the real address:
#   set_real_ip_from 173.245.48.0/20;   # one line per proxy range (Cloudflare publishes its list)
#   real_ip_header CF-Connecting-IP;    # or X-Forwarded-For for a load balancer

# Per-address limit on the API, ahead of Django's own per-endpoint throttles: a bot flood is
# turned away here with 429 before it reaches the app. Bursts cover a page loading several calls
# (and several staff behind one office address).
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_status 429;

# Reuse connections to the API instead of opening one per request
upstream api_server {
    server api:8000;
    keepalive 32;
}

# Compress text responses (scripts, styles, API JSON): most transfers shrink by about 70%,
# which matters on mobile networks. Images and fonts are already compressed.
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types text/plain text/css text/xml application/json application/javascript application/xml
           application/manifest+json image/svg+xml;

server {
    listen 80;
    server_name _;
    client_max_body_size 5m;

    include /etc/nginx/snippets/security-headers.conf;

    location /api/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://api_server;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 60s;
    }

    # Django admin (use DJANGO_ADMIN_URL to move it off the default path)
    location /admin/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://api_server;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
    location /static/ {
        alias /srv/static/;
        expires 30d;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # The single-page web app; hashed assets cache forever, index.html never
    location /assets/ {
        root /srv/app;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }
    location / {
        root /srv/app;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
}
